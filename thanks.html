<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | Thornapple Inc.</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b140d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the boat video fills the screen and pulls away; the thank-you rises in as it goes, then the last frame holds. */
:root { --text: #f5f2ec; --muted: #d4dad5; --accent: #ff6a6e; --font-display: "Fraunces", Georgia, "Times New Roman", serif; --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #0b140d; color: var(--text); font-family: var(--font-body); font-size: 18px; line-height: 1.6; overflow: hidden; }
.stage { position: fixed; inset: 0; }
.stage video { width: 100%; height: 100%; object-fit: cover; object-position: 45% 50%; display: block; }
.stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,12,7,0.55) 0%, rgba(5,12,7,0.05) 32%, rgba(5,12,7,0.25) 55%, rgba(5,12,7,0.9) 100%); }
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 3; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
.mark { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
.mark img { height: 30px; width: auto; }
.top a { color: var(--text); text-decoration: none; font-family: var(--font-display); font-size: 1.3rem; }
.top i { color: var(--accent); font-weight: 400; }
.msg { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 0 20px 44px; max-width: 760px; }
.msg > * { opacity: 0; transform: translateY(26px); animation: rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
.msg .eyebrow { animation-delay: 1.6s; }
.msg h1 { animation-delay: 1.9s; }
.msg p { animation-delay: 2.3s; }
.msg .cta { animation-delay: 2.7s; }
@keyframes rise { to { opacity: 1; transform: none; } }
.eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; display: block; }
h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 16px; text-shadow: 0 2px 20px rgba(0,0,0,0.5); }
h1 em { color: var(--accent); font-weight: 400; }
p { margin: 0 0 22px; color: var(--muted); max-width: 52ch; text-shadow: 0 1px 12px rgba(0,0,0,0.6); }
p b { color: var(--text); font-weight: 600; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-block; font: inherit; font-weight: 600; text-decoration: none; padding: 13px 26px; border-radius: 4px; border: 1px solid #e63946; background: linear-gradient(135deg, #e63946, #a30d24); color: #fff; cursor: pointer; }
.btn.line { background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.45); color: var(--text); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .msg > * { opacity: 1; transform: none; animation: none; } }
</style>
</head>
<body>
<div class="stage">
  <video id="boat" muted playsinline preload="auto" poster="media/boat-poster.jpg" aria-hidden="true">
    <source src="media/boat.mp4" type="video/mp4">
  </video>
</div>
<div class="top"><span class="mark"><img src="images/logo.png" alt=""></span><a href="/">Thornapple <i>Inc.</i></a></div>
<main class="msg">
  <span class="eyebrow">Thank you</span>
  <h1>Your request <em>is in.</em></h1>
  <p>We will be in touch shortly. Need us sooner? Call <b>616.868.9770</b>. We love anything with a motor, so we are rarely far from the phone.</p>
  <div class="cta">
    <a class="btn" href="/">Back to the site</a>
    <button class="btn line" id="replay" type="button">Watch again</button>
  </div>
</main>
<script>
(function () {
  var v = document.getElementById('boat');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play() {
    v.playbackRate = 0.55;
    try { v.currentTime = 0; } catch (e) {}
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  }
  if (!reduce) { v.addEventListener('loadeddata', play, { once: true }); play(); }
  document.getElementById('replay').addEventListener('click', function () {
    play();
  });
})();
</script>
</body>
</html>
